<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Pola Gingham / Kotak-kotak -->
    <pattern id="gingham-green" width="36" height="36" patternUnits="userSpaceOnUse">
      <!-- Dasar Putih -->
      <rect width="36" height="36" fill="#FFFFFF"/>
      <!-- Garis Vertikal (D4DEC8) -->
      <rect x="0" y="0" width="18" height="36" fill="#D4DEC8" opacity="0.85"/>
      <!-- Garis Horisontal (BCCAB4) -->
      <rect x="0" y="0" width="36" height="18" fill="#BCCAB4" opacity="0.85"/>
    </pattern>

    <!-- Bayangan Kartu Luar -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3A4735" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3A4735" flood-opacity="0.10"/>
    </filter>

    <!-- Bayangan Tipis Area Foto Dalam -->
    <filter id="inner-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2C3828" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Bingkai Utama -->
  <rect x="40" y="40" width="520" height="720" rx="16" ry="16" fill="url(#gingham-green)" filter="url(#card-shadow)" stroke="#BCCAB4" stroke-width="1.5"/>

  <!-- Area Foto Tengah (Putih) -->
  <rect x="85" y="85" width="430" height="550" rx="3" ry="3" fill="#FFFFFF" filter="url(#inner-shadow)"/>
  <rect x="85" y="85" width="430" height="550" rx="3" ry="3" fill="#FFFFFF"/>
  <rect x="85" y="85" width="430" height="550" rx="3" ry="3" fill="none" stroke="#BCCAB4" stroke-width="1.2" opacity="0.6"/>
</svg>
